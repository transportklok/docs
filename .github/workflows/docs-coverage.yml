name: docs-coverage

on:
  pull_request:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ${{ vars.RUNNER_TK_2 || 'tk-2' }}
    env:
      READ_TOKEN: ${{ secrets.WORKSPACE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: docs
      - uses: actions/checkout@v4
        with:
          repository: transportklok/transportklok-workspace
          token: ${{ secrets.WORKSPACE_READ_TOKEN }}
          path: workspace
      - name: Check out the product code this docs line documents
        run: |
          line="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
          platform_ref="$line"
          case "$line" in release/*) ;; *) platform_ref=main ;; esac
          remote() { echo "https://x-access-token:${READ_TOKEN}@github.com/$1.git"; }
          fetch() {
            if git clone --quiet --depth 1 --branch "$3" "$(remote "$1")" "workspace/$2" 2>/dev/null; then
              echo "$2: $1@$3"
            else
              echo "::warning::docs coverage could not read $1@$3, so $2 is not scanned"
            fi
          }
          latest_tag() {
            git ls-remote --tags --refs "$(remote "$1")" 2>/dev/null | sed 's#.*refs/tags/##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1
          }
          fetch transportklok/platform platform "$platform_ref"
          mytimeflow_ref=main
          if [ -f workspace/platform/release-dependencies.json ]; then
            mytimeflow_ref=$(python3 -c "import json;print(json.load(open('workspace/platform/release-dependencies.json'))['mytimeflow'])")
          fi
          fetch movingsoftware/mytimeflow mytimeflow "$mytimeflow_ref"
          fetch transportklok/mobile mobile "$(latest_tag transportklok/mobile || echo main)"
          fetch movingsoftware/tachograph-card-client tachograph-card-client main
      - name: Report feature-to-docs gaps as warnings
        run: python3 workspace/scripts/docs-coverage/docs_coverage.py --workspace workspace --docs docs --github --json docs-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: docs-coverage
          path: docs-coverage.json
