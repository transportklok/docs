name: Docs PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  broken-links:
    name: Broken links
    runs-on: ${{ vars.RUNNER_TK_2 || 'tk-2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check links with Mintlify
        run: npx --yes mint@latest broken-links

  leak-lint:
    name: Leak lint
    runs-on: ${{ vars.RUNNER_TK_2 || 'tk-2' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prove the lint fires on each leak kind
        run: scripts/test-leak-lint.sh
      - name: Lint the docs content
        run: scripts/leak-lint.sh
      - name: Lint the capture manifest ids
        run: scripts/manifest-id-lint.sh

  navigation:
    name: Navigation check
    runs-on: ${{ vars.RUNNER_TK_2 || 'tk-2' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prove the check fires on each mismatch
        run: |
          scripts/test-nav-check.sh
          scripts/test-migrate-to-language.sh
      - name: Check the navigation, redirects and links
        run: scripts/nav-check.sh
